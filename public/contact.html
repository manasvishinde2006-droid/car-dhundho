<!DOCTYPE html><html lang="en"><head><title>Contact | Car Dhundho</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="contact.html">
<div id="site-header"></div>
<main class="container section">
 <p class="eyebrow">GET IN TOUCH</p><h1 class="h1">Let's talk about <em>your next car.</em></h1>
 <div class="two">
  <div class="box"><h3>Contact Car Dhundho</h3><p>Questions about a car, a dealer or your search? We're here to help.</p>
   <p class="info"><span>Call us</span><a href="tel:9833327478">+91 9833327478</a></p>
   <p class="info"><span>Service</span>Car listings, dealers and enquiries</p></div>
  <form class="box" data-enquiry>
   <h3>Send us a message</h3>
   <div class="row"><label>Full name<input name="name" required></label><label>Phone<input name="phone" type="tel" required></label></div>
   <label>Email<input name="email" type="email" required></label>
   <label>Topic<select name="subject"><option>Buying a used car</option><option>Car details</option><option>Dealer enquiry</option><option>General enquiry</option></select></label>
   <label>Message<textarea name="message" rows="5" required></textarea></label>
   <button class="btn full">Send enquiry</button><p class="form-msg"></p>
  </form>
 </div>
</main>
<div id="site-footer"></div><script src="js/app.js"></script></body></html>

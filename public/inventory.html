<!DOCTYPE html><html lang="en"><head><title>Inventory | Car Dhundho</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="inventory.html">
<div id="site-header"></div>
<main class="container section">
 <p class="eyebrow">BROWSE PRE-OWNED VEHICLES</p><h1 class="h1">Our <em>inventory.</em></h1>
 <div class="finance"><div><h3>Easy financing, EMI from 9.5%</h3><p>Pick a car, set your down payment and see your monthly EMI instantly.</p></div><button class="btn" data-emi>EMI Calculator</button></div>
 <div class="filters">
  <input id="q" placeholder="Search car name...">
  <select id="fBrand"><option value="">All brands</option></select>
  <select id="fFuel"><option value="">All fuel types</option></select>
  <select id="fBody"><option value="">All body types</option></select>
  <select id="fBudget"><option value="">Any budget</option><option value="0-10">Under ₹10 Lakh</option><option value="10-20">₹10 - ₹20 Lakh</option><option value="20-40">₹20 - ₹40 Lakh</option><option value="40-9999">Above ₹40 Lakh</option></select>
  <select id="fSort"><option value="">Sort: Featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select>
  <button class="btn ghost sm" id="fReset">Reset</button>
 </div>
 <p class="count" id="count"></p>
 <div class="grid" id="cars"></div>
</main>
<div id="site-footer"></div><script src="js/app.js"></script></body></html>
